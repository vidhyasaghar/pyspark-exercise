[project]
name = "EternalSalesData"
version = "0.1.0"
description = "EternalTele Sales data analysis"
readme = "README.md"
authors = [
    { name = "Vidhyasaghar Selvarajan", email = "vidhyasagharnsit@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
sales-data = "eternalsalesdata.main:main"

[project.optional-dependencies]
dev = [
    "chispa==0.9.2",
    "pytest==7.4.4",
    "black==24.3.0",
    "pylint==3.1.0",
    "mypy==1.9.0",
    "setuptools==80.10.2",
]

# --- Black ---
[tool.black]
line-length = 500
target-version = ["py310"]

# --- Pylint ---
[tool.pylint.format]
max-line-length = 500

# --- Mypy ---
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
